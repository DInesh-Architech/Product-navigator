<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise workforce — system and delivery map</title>
  <desc id="desc">Reconstruction based on documented product work. HRMS, CRM, timesheets, payroll and Talent 360 share roles, approvals and data rules. Product delivery moves through workflow mapping, requirements, acceptance criteria, design and engineering handoffs, then QA and release readiness. This is a conceptual product map, not a technical architecture or client screen.</desc>
  <rect width="1440" height="960" fill="#e7e6dd"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1c2721">
    <text x="64" y="76" font-size="15" letter-spacing="2">ENTERPRISE WORKFORCE / PRODUCT SYSTEM</text>
    <text x="64" y="155" font-size="54" font-weight="600" letter-spacing="-1">Five modules. One set of shared rules.</text>
    <text x="64" y="203" font-size="21" fill="#4e5b50">The product work sits in the connections: roles, approvals, handoffs and validation.</text>
    <text x="64" y="272" font-size="14" letter-spacing="1.5">01 / CONNECTED PRODUCT MODULES</text>
    <g fill="#f5f3ec" stroke="#b8beb0">
      <rect x="64" y="297" width="246" height="100"/>
      <rect x="330" y="297" width="246" height="100"/>
      <rect x="596" y="297" width="246" height="100"/>
      <rect x="862" y="297" width="246" height="100"/>
      <rect x="1128" y="297" width="246" height="100"/>
    </g>
    <g font-size="28" font-weight="600">
      <text x="88" y="358">HRMS</text><text x="354" y="358">CRM</text>
      <text x="620" y="358">Timesheets</text><text x="886" y="358">Payroll</text>
      <text x="1152" y="358">Talent 360</text>
    </g>
    <path d="M187 397V448H1251V397M453 397V448M719 397V484M985 397V448" fill="none" stroke="#728262" stroke-width="2"/>
    <g fill="#d9ed79" stroke="#536435" stroke-width="1.5"><circle cx="187" cy="448" r="5"/><circle cx="453" cy="448" r="5"/><circle cx="719" cy="448" r="5"/><circle cx="985" cy="448" r="5"/><circle cx="1251" cy="448" r="5"/></g>
    <rect x="64" y="484" width="1310" height="153" fill="#1c2721"/>
    <g fill="#f5f3ec">
      <text x="90" y="516" font-size="13" letter-spacing="1.5" fill="#d9ed79">02 / RULES THAT CROSS MODULE BOUNDARIES</text>
      <g font-size="26" font-weight="600"><text x="90" y="562">Roles &amp; permissions</text><text x="530" y="562">Approvals</text><text x="969" y="562">Shared data</text></g>
      <g font-size="18" fill="#d5dccd"><text x="90" y="601">Who can see and act</text><text x="530" y="601">Who reviews and decides</text><text x="969" y="601">What stays connected</text></g>
    </g>
    <path d="M500 542V612M939 542V612" stroke="#63705f"/>
    <text x="64" y="694" font-size="14" letter-spacing="1.5">03 / MY DELIVERY WORKFLOW</text>
    <path d="M64 720H1374" stroke="#9ba58e"/>
    <g font-size="13" fill="#536435"><text x="64" y="746">01</text><text x="330" y="746">02</text><text x="596" y="746">03</text><text x="862" y="746">04</text><text x="1128" y="746">05</text></g>
    <g font-size="23" font-weight="600">
      <text x="64" y="783">Role &amp; workflow<tspan x="64" dy="29">mapping</tspan></text>
      <text x="330" y="783">Requirements</text>
      <text x="596" y="783">Acceptance<tspan x="596" dy="29">criteria</tspan></text>
      <text x="862" y="783">Design &amp;<tspan x="862" dy="29">engineering handoffs</tspan></text>
      <text x="1128" y="783">QA &amp; release<tspan x="1128" dy="29">readiness</tspan></text>
    </g>
    <g font-size="23" fill="#536435"><text x="285" y="788">→</text><text x="551" y="788">→</text><text x="817" y="788">→</text><text x="1083" y="788">→</text></g>
    <path d="M64 883H1374" stroke="#bac1af"/>
    <text x="64" y="920" font-size="16" fill="#4e5b50">Reconstructed from documented product work · No client screens, records or data · Not a technical architecture</text>
  </g>
</svg>
