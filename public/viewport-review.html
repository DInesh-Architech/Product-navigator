<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Portfolio viewport review</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#d7d9d3;font:12px system-ui}header{display:flex;gap:16px;align-items:center;margin-bottom:14px}button,select{padding:8px}.frames{display:flex;gap:28px;align-items:start}figure{margin:0}figcaption{margin:0 0 8px}iframe{background:white;border:0;height:820px}#mobile{width:390px}#tablet{width:768px}</style></head><body><header><label for="route">Page</label><select id="route"><option value="/">Homepage</option><option value="/work/enterprise-workforce-platform">Enterprise case</option><option value="/work/construction-billing-sov">Construction case</option><option value="/work/healthcare-platform-enhancement">Healthcare case</option></select><label for="width">Mobile width</label><select id="width"><option>390</option><option>360</option><option>320</option><option>430</option></select><button id="production">Review production</button></header><div class="frames"><figure><figcaption>Mobile viewport</figcaption><iframe id="mobile" title="Mobile portfolio" src="/"></iframe></figure><figure><figcaption>Tablet viewport · 768 px</figcaption><iframe id="tablet" title="Tablet portfolio" src="/"></iframe></figure></div><script>let base='';const route=document.getElementById('route');function load(){document.getElementById('mobile').src=base+route.value;document.getElementById('tablet').src=base+route.value;}route.onchange=load;document.getElementById('width').onchange=e=>{document.getElementById('mobile').style.width=e.target.value+'px';};document.getElementById('production').onclick=()=>{base='https://product-navigator-lake.vercel.app';load();};</script></body></html>
